<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro moderno -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <!-- Efecto 3D para las teclas -->
    <linearGradient id="key" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A5568" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>

    <!-- Color de acento vibrante (estilo YouTube/Video) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>

    <!-- Sombra base -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Contenedor principal del icono -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bg)" stroke="#4A5568" stroke-width="2" filter="url(#shadow)"/>

  <!-- Tecla superior grande (Representa la pantalla/reproductor) -->
  <rect x="24" y="26" width="80" height="48" rx="8" fill="url(#key)" stroke="#718096" stroke-width="2"/>
  
  <!-- Icono de Play -->
  <path d="M54 36 L76 50 L54 64 Z" fill="url(#accent)"/>

  <!-- Fila de atajos inferiores -->
  <!-- Tecla '1' (Representa atajos numéricos, como el 10%) -->
  <rect x="24" y="82" width="22" height="22" rx="6" fill="url(#key)" stroke="#718096" stroke-width="2"/>
  <text x="35" y="93" dy="0.35em" fill="#F7FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1</text>

  <!-- Tecla 'F' (Representa atajos de letras, como Fullscreen) -->
  <rect x="53" y="82" width="22" height="22" rx="6" fill="url(#key)" stroke="#718096" stroke-width="2"/>
  <text x="64" y="93" dy="0.35em" fill="#F7FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">F</text>

  <!-- Tecla de Personalización (Sliders) -->
  <rect x="82" y="82" width="22" height="22" rx="6" fill="url(#key)" stroke="#718096" stroke-width="2"/>
  <line x1="86" y1="89" x2="100" y2="89" stroke="#F7FAFC" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="97" x2="100" y2="97" stroke="#F7FAFC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="90" cy="89" r="2.5" fill="url(#accent)"/>
  <circle cx="96" cy="97" r="2.5" fill="url(#accent)"/>
</svg>