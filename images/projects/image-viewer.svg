    <path d="M 160 190 L 160 160 L 190 160" /> <path d="M 322 160 L 352 160 L 352 190" /> <path d="M 160 322 L 160 352 L 190 352" /> <path d="M 322 352 L 352 352 L 352 322" /> </g>

  <circle cx="256" cy="256" r="95" fill="#141E30" stroke="#4FACFE" stroke-width="6" opacity="0.95" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#00F2FE" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <text x="256" y="275" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">ABR</text>

  <circle cx="256" cy="318" r="4" fill="#00F2FE" filter="url(#glow)"/>
